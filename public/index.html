<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geopolitical & Infrastructure Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; height: 100vh; display: flex; flex-direction: column; }

    #header {
      padding: 10px 16px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    #header h1 { font-size: 15px; font-weight: 600; color: #f0f6fc; white-space: nowrap; }

    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .toggle-btn {
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #e6edf3;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toggle-btn.active { border-color: currentColor; }
    .toggle-btn.frontline { color: #ff6b6b; }
    .toggle-btn.frontline.active { background: rgba(255,107,107,0.15); }
    .toggle-btn.datacenters { color: #4ecdc4; }
    .toggle-btn.datacenters.active { background: rgba(78,205,196,0.15); }
    .toggle-btn.military { color: #ffe66d; }
    .toggle-btn.military.active { background: rgba(255,230,109,0.15); }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

    #filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      padding: 6px 16px;
      background: #0d1117;
      border-bottom: 1px solid #21262d;
      font-size: 12px;
    }

    select {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
    }

    label { color: #8b949e; }

    #map { flex: 1; }

    .leaflet-popup-content-wrapper {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .leaflet-popup-tip { background: #161b22; }
    .leaflet-popup-content { margin: 10px 14px; font-size: 13px; min-width: 180px; }
    .popup-title { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .popup-row { display: flex; gap: 6px; color: #8b949e; margin-top: 3px; }
    .popup-row span:last-child { color: #e6edf3; }
    .popup-tag {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #stats {
      position: absolute;
      bottom: 28px;
      right: 10px;
      z-index: 1000;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
    }
    .stat-row { display: flex; justify-content: space-between; gap: 20px; margin-top: 4px; }
    .stat-label { color: #8b949e; }
    .stat-val { font-weight: 600; }
  </style>
</head>
<body>
  <div id="header">
    <h1>Geopolitical & Infrastructure Map</h1>
    <div class="controls">
      <button class="toggle-btn frontline active" id="btn-frontline" onclick="toggleLayer('frontline')">
        <span class="dot"></span> Ukraine Front Line
      </button>
      <button class="toggle-btn datacenters active" id="btn-datacenters" onclick="toggleLayer('datacenters')">
        <span class="dot"></span> Data Centers
      </button>
      <button class="toggle-btn military active" id="btn-military" onclick="toggleLayer('military')">
        <span class="dot"></span> US Military Bases
      </button>
    </div>
  </div>

  <div id="filter-row">
    <label for="dc-filter">Data Center Provider:</label>
    <select id="dc-filter" onchange="filterDatacenters(this.value)">
      <option value="">All Providers</option>
      <option value="AWS">AWS</option>
      <option value="Google">Google Cloud</option>
      <option value="Azure">Azure</option>
      <option value="Meta">Meta</option>
      <option value="Apple">Apple</option>
      <option value="Oracle">Oracle Cloud</option>
      <option value="Equinix">Equinix</option>
    </select>
    &nbsp;
    <label for="mil-filter">Military Branch:</label>
    <select id="mil-filter" onchange="filterMilitary(this.value)">
      <option value="">All Branches</option>
      <option value="Army">Army</option>
      <option value="Navy">Navy</option>
      <option value="Air Force">Air Force</option>
      <option value="Marines">Marines</option>
      <option value="Space Force">Space Force</option>
    </select>
    &nbsp;
    <label for="mil-country">Host Country:</label>
    <select id="mil-country" onchange="filterMilitaryCountry(this.value)">
      <option value="">All Countries</option>
      <option value="United States">United States</option>
      <option value="Japan">Japan</option>
      <option value="South Korea">South Korea</option>
      <option value="Germany">Germany</option>
      <option value="United Kingdom">United Kingdom</option>
      <option value="Italy">Italy</option>
      <option value="Spain">Spain</option>
      <option value="Qatar">Qatar</option>
      <option value="Bahrain">Bahrain</option>
      <option value="Kuwait">Kuwait</option>
      <option value="Djibouti">Djibouti</option>
      <option value="Guam">Guam</option>
    </select>
  </div>

  <div id="map"></div>

  <div id="stats">
    <div style="font-weight:600; margin-bottom:4px; color:#f0f6fc">Visible Features</div>
    <div class="stat-row">
      <span class="stat-label" style="color:#ff6b6b">Front Line</span>
      <span class="stat-val" id="stat-fl">1 line</span>
    </div>
    <div class="stat-row">
      <span class="stat-label" style="color:#4ecdc4">Data Centers</span>
      <span class="stat-val" id="stat-dc">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label" style="color:#ffe66d">Military Bases</span>
      <span class="stat-val" id="stat-mil">—</span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: true }).setView([20, 10], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap, &copy; CartoDB',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    const layers = { frontline: null, datacenters: null, military: null };
    const visibility = { frontline: true, datacenters: true, military: true };

    let allDcFeatures = [];
    let allMilFeatures = [];

    function dcColor(provider) {
      const colors = {
        AWS: '#FF9900', Google: '#4285F4', Azure: '#0089D6',
        Meta: '#1877F2', Apple: '#A2AAAD', Oracle: '#F80000',
        Equinix: '#ED2224'
      };
      return colors[provider] || '#4ecdc4';
    }

    function makeDcMarker(feature) {
      const color = dcColor(feature.properties.provider);
      const icon = L.divIcon({
        className: '',
        html: `<div style="width:10px;height:10px;border-radius:50%;background:${color};border:2px solid rgba(255,255,255,0.3);box-shadow:0 0 6px ${color}88"></div>`,
        iconSize: [10, 10], iconAnchor: [5, 5]
      });
      const m = L.marker([feature.geometry.coordinates[1], feature.geometry.coordinates[0]], { icon });
      const p = feature.properties;
      m.bindPopup(`
        <div class="popup-tag" style="background:${color}22;color:${color}">${p.provider}</div>
        <div class="popup-title">${p.name}</div>
        <div class="popup-row"><span>Region:</span><span>${p.region || '—'}</span></div>
        <div class="popup-row"><span>City:</span><span>${p.city}</span></div>
        <div class="popup-row"><span>Country:</span><span>${p.country}</span></div>
        ${p.note ? `<div class="popup-row"><span>Note:</span><span>${p.note}</span></div>` : ''}
      `);
      return m;
    }

    function makeMilMarker(feature) {
      const icon = L.divIcon({
        className: '',
        html: `<div style="width:12px;height:12px;background:#ffe66d;border:2px solid rgba(0,0,0,0.4);transform:rotate(45deg);box-shadow:0 0 6px #ffe66d88"></div>`,
        iconSize: [12, 12], iconAnchor: [6, 6]
      });
      const m = L.marker([feature.geometry.coordinates[1], feature.geometry.coordinates[0]], { icon });
      const p = feature.properties;
      m.bindPopup(`
        <div class="popup-tag" style="background:#ffe66d22;color:#ffe66d">${p.branch}</div>
        <div class="popup-title">${p.name}</div>
        <div class="popup-row"><span>City:</span><span>${p.city}</span></div>
        <div class="popup-row"><span>Country:</span><span>${p.country}</span></div>
        ${p.description ? `<div class="popup-row" style="margin-top:6px;color:#8b949e;font-size:11px">${p.description}</div>` : ''}
      `);
      return m;
    }

    function renderDcLayer(features) {
      if (layers.datacenters) map.removeLayer(layers.datacenters);
      const group = L.layerGroup(features.map(makeDcMarker));
      layers.datacenters = group;
      if (visibility.datacenters) group.addTo(map);
      document.getElementById('stat-dc').textContent = features.length + ' locations';
    }

    function renderMilLayer(features) {
      if (layers.military) map.removeLayer(layers.military);
      const group = L.layerGroup(features.map(makeMilMarker));
      layers.military = group;
      if (visibility.military) group.addTo(map);
      document.getElementById('stat-mil').textContent = features.length + ' bases';
    }

    function filterDatacenters(provider) {
      const filtered = provider
        ? allDcFeatures.filter(f => f.properties.provider === provider)
        : allDcFeatures;
      renderDcLayer(filtered);
    }

    function filterMilitary(branch) {
      const countryVal = document.getElementById('mil-country').value;
      let filtered = allMilFeatures;
      if (branch) filtered = filtered.filter(f => f.properties.branch.includes(branch));
      if (countryVal) filtered = filtered.filter(f => f.properties.country === countryVal);
      renderMilLayer(filtered);
    }

    function filterMilitaryCountry(country) {
      const branchVal = document.getElementById('mil-filter').value;
      let filtered = allMilFeatures;
      if (branchVal) filtered = filtered.filter(f => f.properties.branch.includes(branchVal));
      if (country) filtered = filtered.filter(f => f.properties.country === country);
      renderMilLayer(filtered);
    }

    function toggleLayer(name) {
      visibility[name] = !visibility[name];
      const btn = document.getElementById('btn-' + name);
      if (visibility[name]) {
        btn.classList.add('active');
        if (layers[name]) layers[name].addTo(map);
      } else {
        btn.classList.remove('active');
        if (layers[name]) map.removeLayer(layers[name]);
      }
    }

    async function loadAll() {
      const [flData, dcData, milData] = await Promise.all([
        fetch('/api/ukraine/frontline').then(r => r.json()),
        fetch('/api/datacenters').then(r => r.json()),
        fetch('/api/military/bases').then(r => r.json())
      ]);

      // Ukraine front line
      const flGroup = L.layerGroup();
      const mainLine = flData.features.find(f => f.geometry.type === 'LineString');
      if (mainLine) {
        L.polyline(mainLine.geometry.coordinates.map(c => [c[1], c[0]]), {
          color: '#ff6b6b', weight: 3, opacity: 0.9,
          dashArray: '8, 4'
        }).bindPopup(`
          <div class="popup-tag" style="background:#ff6b6b22;color:#ff6b6b">FRONT LINE</div>
          <div class="popup-title">Ukraine-Russia Contact Line</div>
          <div class="popup-row" style="color:#8b949e;font-size:11px;margin-top:4px">${flData.metadata.disclaimer}</div>
        `).addTo(flGroup);
      }
      const crimea = flData.features.find(f => f.properties.name === 'Crimea Peninsula');
      if (crimea) {
        L.polygon(crimea.geometry.coordinates[0].map(c => [c[1], c[0]]), {
          color: '#ff6b6b', fillColor: '#ff6b6b', fillOpacity: 0.12, weight: 2, dashArray: '4,3'
        }).bindPopup(`
          <div class="popup-tag" style="background:#ff6b6b22;color:#ff6b6b">OCCUPIED</div>
          <div class="popup-title">Crimea Peninsula</div>
          <div class="popup-row"><span>Status:</span><span>Russian-occupied since 2014</span></div>
        `).addTo(flGroup);
      }
      const kursk = flData.features.find(f => f.properties.name === 'Kursk Incursion Zone');
      if (kursk) {
        L.circleMarker([kursk.geometry.coordinates[1], kursk.geometry.coordinates[0]], {
          radius: 8, color: '#ffa500', fillColor: '#ffa500', fillOpacity: 0.3, weight: 2
        }).bindPopup(`
          <div class="popup-tag" style="background:#ffa50022;color:#ffa500">CONTESTED</div>
          <div class="popup-title">Kursk Incursion Zone</div>
          <div class="popup-row" style="color:#8b949e;font-size:11px">Ukrainian-held territory inside Kursk Oblast, Russia (extent varies)</div>
        `).addTo(flGroup);
      }
      layers.frontline = flGroup;
      if (visibility.frontline) flGroup.addTo(map);

      // Data centers
      allDcFeatures = dcData.features;
      renderDcLayer(allDcFeatures);

      // Military bases
      allMilFeatures = milData.features;
      renderMilLayer(allMilFeatures);
    }

    loadAll();
  </script>
</body>
</html>
